name: Verify Windows certificate cache
on: pull_request
permissions:
  contents: read
jobs:
  cache-permissions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -v cmd/birdwatch/cache_windows.go cmd/birdwatch/cache_windows_test.go
