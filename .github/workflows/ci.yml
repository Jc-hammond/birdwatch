name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build from source, lint and test the server
        run: make build lint test-server check-clean
      - name: Enforce the 2M-event report budget on Go
        env:
          BIRDWATCH_SERVER_CMD: ./build/birdwatch
        run: go run ./bench --events 2000000 --budget-ms 300

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test the JavaScript packages and compile the dashboard
        run: make test-js && make check-clean

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Build and test Swift
        if: runner.os == 'macOS'
        run: make test-swift && make check-clean
      - uses: actions/setup-java@v5
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble Android and run JVM conformance
        if: runner.os == 'Linux'
        run: make test-android && make check-clean

  size:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency: size-comment-${{ github.event.pull_request.number }}
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Update source line counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/size.mjs
