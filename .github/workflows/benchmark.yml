name: Nightly 10M benchmark

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, reopened]
    paths: ['.github/workflows/benchmark.yml']

permissions:
  contents: read

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: make build
      - name: Measure all five reports at 10M events
        env:
          BIRDWATCH_SERVER_CMD: ./build/birdwatch
        run: go run ./bench --events 10000000 --budget-ms 300
