name: Bug report
description: Report a problem with Birdwatch.
body:
  - type: input
    id: version
    attributes:
      label: Birdwatch version or commit
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce the problem?
      description: Include your operating system and the smallest example that shows the problem. Use synthetic data.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What did you expect, and what happened?
    validations:
      required: true
